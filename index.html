/* Βοηθητικές λειτουργίες εμφάνισης. */
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

function imageTag(filename, title, className = "") {
  return `<img
    class="${escapeHTML(className)}"
    src="${MEDIA + escapeHTML(filename)}"
    alt="${escapeHTML(title)}"
    loading="lazy">`;
}

function card(item, className = "") {
  const inner = imageTag(item.image, item.title) +
    `<strong>${escapeHTML(item.title)}</strong>`;

  if (!item.url) {
    return `<figure class="card ${className}">${inner}</figure>`;
  }

  const external = !item.url.startsWith("#");
  return `<a class="card ${className}"
    href="${escapeHTML(item.url)}"
    ${external ? 'target="_blank" rel="noopener noreferrer"' : ""}>
    ${inner}
  </a>`;
}

function grid(items) {
  return `<div class="grid">${items.map(item => card(item)).join("")}</div>`;
}

/* Πλοήγηση: λειτουργούν και τα κουμπιά Πίσω/Μπροστά του browser. */
function renderPage() {
  const requested = location.hash.slice(1) || "home";
  const id = Object.prototype.hasOwnProperty.call(pages, requested)
    ? requested : "home";
  const page = pages[id];

  content.innerHTML = page.render();
  document.title = page.title + " | Καραγιαννίδου Δέσποινα";

  document.querySelectorAll("nav a").forEach(link => {
    const navId = link.getAttribute("href").slice(1);
    const selected = navId === id ||
      (navId === "lessons" && grades.some(grade => grade.id === id));
    if (selected) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });

  const form = document.getElementById("contact-form");
  if (form) {
    form.addEventListener("submit", event => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const data = new FormData(form);
      const body = [
        "Όνομα: " + data.get("firstName"),
        "Επίθετο: " + data.get("lastName"),
        "Σχολείο και τάξη: " + data.get("school"),
        "",
        data.get("message")
      ].join("\n");

      location.href = "mailto:karadespina@yahoo.gr" +
